# env.yml — Conda environment file for the SEN12MS-CR cloud-removal project.
# Mirrors the pip commands in README §Setup so the manual conda+pip sequence
# becomes a single `conda env create` call.
#
# Quick install (Linux + CUDA 12.1):
#     conda env create -f env.yml
#     conda activate emrdm
#     # Final manual step — needed for EMRDM Phase 2 only; safe to skip for Phase 1:
#     MAX_JOBS=4 pip install flash_attn==2.5.9.post1 --no-build-isolation
#
# Run training:
#     cd phase1_mirror_map
#     python train_mirror_map.py --data_root <DATA> --output_dir <OUT> --epochs 100 --batch_size 16
#
# Run the smoke test:
#     python -m pytest tests/integration/test_train_mirror_map.py -v
#     # or, without pytest:
#     python -m tests/integration/test_train_mirror_map.py
#
# On macOS or non-CUDA Linux, remove the `--find-links` + `natten==...` lines
# below and skip the flash_attn step. Phase 1 mirror-map training does not
# require either package.

name: emrdm
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - torch==2.2.1
      - torchaudio==2.2.1
      - torchvision==0.17.1
      - numpy==1.26.4
      - pytorch-lightning==2.3.0
      - wandb
      - omegaconf
      - rasterio
      - tifffile
      - scipy
      - opencv-python
      - lpips
      # - --find-links https://shi-labs.com/natten/wheels
      # - natten==0.17.1+torch220cu121
      - pytest
